[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stub-out-claude-md"
version = "0.1.0"
description = "pre-commit hook: keep AGENTS.md as source of truth and CLAUDE.md as an @AGENTS.md stub"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/pietercusters/stub-out-claude-md"

[project.scripts]
stub-out-claude-md = "stub_out_claude_md:main"

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=4"]

# Public repo: lock against PyPI, overriding any contributor-local index
# (e.g. a company registry in ~/.config/uv/uv.toml).
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["stub_out_claude_md"]
